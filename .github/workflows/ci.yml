name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff formatting check
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      # Tests use fixture knowledge data and fake embedding/generation
      # providers: no model download, no Gemini credentials, no network.
      - name: Run tests
        env:
          GEMINI_API_KEY: ""
          GEMINI_MODEL: ""
        run: pytest -q

  image:
    name: Docker image builds and passes its health check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t mori-ci .

      # Boots the image exactly as Render does (no secrets, single worker) and
      # requires /health to report the committed dataset before the job passes.
      - name: Run container and probe /health
        run: |
          docker run -d --name mori -p 8000:8000 mori-ci
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8000/health > health.json; then break; fi
            sleep 2
          done
          cat health.json
          python -c "import json; h=json.load(open('health.json')); assert h['dataset_loaded'] and h['dataset_complete'], h"
          docker logs mori | tail -20
          docker rm -f mori
